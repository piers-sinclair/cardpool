name: Validate Packaging

on:
  push:
    branches:
      - main
    paths:
      - 'packaging/**'
      - '.github/workflows/validate-packaging.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/validate-packaging.yml'
  workflow_dispatch:

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve manifest version
        id: ver
        shell: pwsh
        run: |
          $version = (Select-String -Path src/CardPool.Cli/CardPool.Cli.csproj -Pattern '<Version>(.*?)</Version>').Matches[0].Groups[1].Value
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate winget manifest
        shell: pwsh
        run: winget validate packaging/winget/manifests/p/PiersSinclair/CardPool/${{ steps.ver.outputs.version }}

  homebrew:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check formula style
        run: brew style packaging/homebrew/cpool.rb
