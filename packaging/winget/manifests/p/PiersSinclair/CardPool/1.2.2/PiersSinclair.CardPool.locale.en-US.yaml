ShortDescription: Card pool generator for trading card game formats
Description: |-
  CardPool fetches Yu-Gi-Oh! cards from YGOProDeck, enriches them with errata history
  from Yugipedia, applies configurable word-count rules, and exports eligible card pools
  to Excel/CSV. Designed for Edison format play.
